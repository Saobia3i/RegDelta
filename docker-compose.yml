# Local development stack (synthetic data only). Not a production deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: RegDelta_owner
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: RegDelta
    volumes: ["pgdata:/var/lib/postgresql/data", "./deploy/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "RegDelta_owner"], interval: 5s, retries: 10 }
  clamav:
    image: clamav/clamav:1.4
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, retries: 20 }
  migrate:
    build: .
    command: sh -c "alembic upgrade head && python -m RegDelta_ops.seed --demo"
    environment: &env
      RegDelta_ENV: local
      RegDelta_DATABASE_URL: postgresql+psycopg://RegDelta_app:devpass@db/RegDelta
      RegDelta_ADMIN_DATABASE_URL: postgresql+psycopg://RegDelta_owner:devpass@db/RegDelta
      RegDelta_STORAGE_DIR: /app/var/objects
      RegDelta_SCANNER: clamav
      RegDelta_CLAMD_HOST: clamav
      RegDelta_AI_PROVIDER: ${RegDelta_AI_PROVIDER:-mock}
      RegDelta_ANTHROPIC_API_KEY: ${RegDelta_ANTHROPIC_API_KEY:-}
      RegDelta_OPENROUTER_API_KEY: ${RegDelta_OPENROUTER_API_KEY:-${RegDelta_OPENROUTER_API:-}}
      RegDelta_OPENROUTER_BASE_URL: ${RegDelta_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      RegDelta_OPENROUTER_REFERER: ${RegDelta_OPENROUTER_REFERER:-}
      RegDelta_OPENROUTER_APP_TITLE: ${RegDelta_OPENROUTER_APP_TITLE:-RegDelta}
      RegDelta_AI_MODEL: ${RegDelta_AI_MODEL:-}
    volumes: ["objects:/app/var/objects"]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: .
    environment: *env
    ports: ["8000:8000"]
    volumes: ["objects:/app/var/objects"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker-ingest:
    build: .
    command: python -m RegDelta_ops.jobs.worker --kinds ingest_evidence,execute_deletion,retention_sweep
    environment: *env
    volumes: ["objects:/app/var/objects"]
    depends_on: { migrate: { condition: service_completed_successfully }, clamav: { condition: service_healthy } }
  worker-ai:
    build: .
    command: python -m RegDelta_ops.jobs.worker --kinds ai_review_evidence,ai_answer_questionnaire_item,connector_sync
    environment: *env
    volumes: ["objects:/app/var/objects"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { pgdata: {}, objects: {} }
